name: Build KivyMD APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install buildozer and cython
        run: |
          pip3 install --user buildozer cython==3.0.11

      # !!! НОВЫЙ ШАГ: Явное принятие лицензий !!!
      - name: Accept Android SDK licenses
        run: |
          # Находим путь к sdkmanager, который использует Buildozer
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager -type f | head -n 1)
          # Если sdkmanager не найден, используем стандартный путь Android SDK
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          # Автоматически принимаем все лицензии
          yes | $SDKMANAGER --licenses || true

      - name: Clean previous build cache
        run: |
          rm -rf .buildozer

      - name: Build APK
        run: |
          # 'yes |' автоматически отвечает 'y' на все запросы
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
