name: Build KivyMD APK

on:
  push:
    branches: Mir_theme_succsess
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev automake libltdl-dev

      - name: Install buildozer and cython
        run: |
          pip3 install --user buildozer cython==3.0.11

      # ── Декодируем постоянный keystore из секрета ──
      - name: Decode debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/debug-keystore.jks
            chmod 600 /tmp/debug-keystore.jks
            echo "DEBUG_KEYSTORE_FILE=/tmp/debug-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi

      # !!! Полная очистка кэша (оставлено как было) !!!
      - name: Clean build cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
